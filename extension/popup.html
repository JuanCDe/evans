<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evans</title><link rel="stylesheet" href="ui/styles.css"></head>
<body class="popup-body">
  <header class="popup-header"><span class="popup-brand"><span class="brand-mark" aria-hidden="true"></span>evans<span class="brand-dot">.</span></span><span class="local-chip"><span class="status-dot good"></span>Local only</span></header>
  <div class="popup-summary"><p class="popup-intro">Your monitored pages</p><p class="popup-stats" id="popup-stats" role="status">Loading…</p></div>
  <div class="popup-buttons">
    <button class="button primary" id="monitor-site">Monitor this site with Evans <span aria-hidden="true">＋</span></button>
    <button class="button" id="open-dashboard">Open dashboard <span aria-hidden="true">↗</span></button>
  </div>
  <footer class="popup-footer"><button class="text-button" id="review-now">Check all pages</button><p class="popup-foot" id="popup-message" role="status"></p></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
